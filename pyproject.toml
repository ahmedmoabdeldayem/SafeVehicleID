[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "safevehicleid"
version = "0.1.0"
description = "Multi-camera vehicle tracking and anomaly detection pipeline"
requires-python = ">=3.11"
dependencies = [
    "numpy==1.26.4",
    "opencv-python==4.10.0.84",
    "scipy==1.13.1",
    "ultralytics==8.3.0",
    "easyocr==1.7.2",
    "torch==2.4.1",
    "torchvision==0.19.1",
    "pyyaml==6.0.3",
    "scikit-learn==1.5.2",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["python*"]

[tool.pytest.ini_options]
testpaths = ["python/tests"]
pythonpath = ["python"]
